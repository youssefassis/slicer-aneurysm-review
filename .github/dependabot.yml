# Keeps the actions in checks.yml current without anyone remembering to look.
#
# Only GitHub Actions: requirements-dev.txt gives minimum versions rather than pins, so every
# install already gets the newest numpy, pytest and ruff and there is nothing to bump there.

version: 2
updates:
  # checks.yml pins actions/checkout, actions/setup-python and actions/upload-artifact by
  # major version; this is what notices when those majors move. Each major arrives as its own
  # PR, since the repo's rule is that a major needs a compatibility check first.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
